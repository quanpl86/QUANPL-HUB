<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Command Center | QUAN-PL HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #16213e, #0f3460);
            color: #e9ecef;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .neo-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .neo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .notebook-card {
            transition: all 0.4s ease;
        }
        .notebook-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d2ff;
        }
    </style>
</head>
<body class="p-6 lg:p-10">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">MCP Command Center</h1>
                <p class="text-gray-400 mt-2">Hệ điều hành nội dung AI & NotebookLM</p>
            </div>
            <div class="flex gap-4">
                <button onclick="refreshAuth()" class="glass px-5 py-2.5 flex items-center gap-2 hover:bg-white/10 transition-all">
                    <i data-lucide="shield-check" class="text-green-400"></i>
                    <span>Auth Status</span>
                </button>
                <div class="glass px-5 py-2.5 flex items-center gap-2">
                    <i data-lucide="cpu" class="text-blue-400"></i>
                    <span id="health-status">Checking System...</span>
                </div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass p-6">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-blue-500/20 p-3 rounded-xl">
                        <i data-lucide="book-open" class="text-blue-400"></i>
                    </div>
                    <span class="text-2xl font-bold" id="notebook-count">0</span>
                </div>
                <h3 class="text-gray-400">Notebooks Active</h3>
            </div>
            <div class="glass p-6">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-cyan-500/20 p-3 rounded-xl">
                        <i data-lucide="database" class="text-cyan-400"></i>
                    </div>
                    <span class="text-2xl font-bold" id="quota-usage">--</span>
                </div>
                <h3 class="text-gray-400">Quota (Gemini 1.5)</h3>
            </div>
            <div class="glass p-6 border-blue-500/30">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-purple-500/20 p-3 rounded-xl">
                        <i data-lucide="zap" class="text-purple-400"></i>
                    </div>
                    <span class="text-green-400 text-sm flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full status-pulse"></span>
                        LIVE
                    </span>
                </div>
                <h3 class="text-gray-400">MCP Worker Status</h3>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar/Actions -->
            <div class="lg:col-span-1 space-y-6">
                <button onclick="openCreateModal()" class="neo-button w-full py-4 rounded-2xl font-semibold flex items-center justify-center gap-2 mb-4">
                    <i data-lucide="plus-circle"></i>
                    Tạo Notebook Mới
                </button>
                <div class="glass p-6 space-y-4">
                    <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <i data-lucide="terminal" class="w-5 h-5"></i>
                        Hành động nhanh
                    </h2>
                    <button onclick="reAuth()" class="w-full text-left p-3 rounded-xl hover:bg-white/5 transition-all flex items-center gap-3">
                        <i data-lucide="key" class="w-4 h-4 text-orange-400"></i>
                        Làm mới xác thực
                    </button>
                    <button onclick="syncAll()" class="w-full text-left p-3 rounded-xl hover:bg-white/5 transition-all flex items-center gap-3">
                        <i data-lucide="refresh-cw" class="w-4 h-4 text-cyan-400"></i>
                        Đồng bộ thư viện
                    </button>
                    <button id="sync-cloud-btn" onclick="syncToCloud()" class="w-full text-left p-3 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 transition-all flex items-center gap-3 border border-blue-500/20">
                        <i data-lucide="cloud-upload" class="w-4 h-4 text-blue-400"></i>
                        Đồng bộ lên Supabase
                    </button>
                </div>
            </div>

            <!-- Notebook List -->
            <div class="lg:col-span-3">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Thư viện NotebookLM</h2>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Tìm kiếm notebook..." class="glass bg-transparent px-4 py-2 text-sm focus:outline-none focus:border-blue-500 w-64">
                    </div>
                </div>
                <div id="notebook-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Cards will be injected here -->
                    <div class="lg:col-span-2 flex flex-col items-center justify-center py-20 opacity-50">
                        <i data-lucide="loader" class="w-10 h-10 animate-spin mb-4"></i>
                        <p>Đang tải dữ liệu từ MCP Server...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tạo Notebook -->
    <div id="create-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="glass max-w-md w-full p-8">
            <h2 class="text-2xl font-bold mb-6">Tạo Notebook Mới</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-2">Tên Notebook</label>
                    <input id="new-nb-name" type="text" class="w-full glass bg-transparent px-4 py-3 focus:outline-none focus:border-blue-500" placeholder="Ví dụ: Robotics Heritage">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-2">Mô tả (Không bắt buộc)</label>
                    <textarea id="new-nb-desc" class="w-full glass bg-transparent px-4 py-3 focus:outline-none focus:border-blue-500 h-24"></textarea>
                </div>
                <div class="flex gap-4 mt-8">
                    <button onclick="closeCreateModal()" class="flex-1 py-3 text-gray-400 hover:text-white transition-all">Hủy</button>
                    <button onclick="submitCreateNotebook()" class="flex-1 neo-button py-3 rounded-xl font-bold">Xác nhận tạo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo Lucide icons
        lucide.createIcons();

        // API Configuration
        const API_BASE = 'http://localhost:3005/api';

        async function fetchNotebooks() {
            const grid = document.getElementById('notebook-grid');
            try {
                const res = await fetch(`${API_BASE}/notebooks`);
                const response = await res.json();
                
                const notebooks = response.data || [];
                const rawText = response.raw || "";
                
                document.getElementById('notebook-count').innerText = notebooks.length || (rawText ? '?' : '0');
                
                if (notebooks.length === 0 && rawText) {
                    grid.innerHTML = `
                        <div class="lg:col-span-3 glass p-6">
                            <h3 class="text-sm font-bold text-gray-400 mb-4 uppercase">Dữ liệu thô từ MCP</h3>
                            <pre class="text-xs text-blue-300 overflow-x-auto whitespace-pre-wrap">${rawText}</pre>
                        </div>
                    `;
                    return;
                }

                if (notebooks.length === 0) {
                    grid.innerHTML = '<p class="lg:col-span-3 text-center py-10 text-gray-500 italic">Thư viện trống.</p>';
                    return;
                }

                grid.innerHTML = notebooks.map(nb => `
                    <div class="glass p-6 notebook-card cursor-pointer">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-xl">${nb.name || 'Untitled'}</h3>
                            <div class="bg-blue-500/10 p-2 rounded-lg">
                                <i data-lucide="external-link" class="w-4 h-4 text-blue-400"></i>
                            </div>
                        </div>
                        <p class="text-gray-400 text-sm mb-6 line-clamp-2">${nb.description || 'Không có mô tả.'}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-blue-300 font-mono">${(nb.id || '').substring(0, 8)}...</span>
                            <div class="flex gap-2">
                                <button class="px-3 py-1.5 rounded-lg border border-white/10 text-xs hover:bg-white/5">Quản lý</button>
                                <button class="px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-400 text-xs hover:bg-blue-500/30">Chọn dùng</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                lucide.createIcons();
            } catch (err) {
                grid.innerHTML = `
                    <div class="lg:col-span-3 glass p-10 border-red-500/30 text-center">
                        <i data-lucide="alert-triangle" class="w-10 h-10 text-red-400 mx-auto mb-4"></i>
                        <p class="text-red-400 font-semibold mb-2">Lỗi hiển thị dữ liệu</p>
                        <p class="text-gray-400 text-sm mb-4">${err.message}</p>
                        <button onclick="fetchNotebooks()" class="px-4 py-2 bg-white/5 rounded-lg hover:bg-white/10 transition-all text-xs">Thử lại ngay</button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                document.getElementById('health-status').innerText = 'System Healthy';
                document.getElementById('health-status').classList.add('text-green-400');
            } catch (err) {
                document.getElementById('health-status').innerText = 'System Offline';
                document.getElementById('health-status').classList.add('text-red-400');
            }
        }

        async function refreshAuth() {
            if (confirm('Bắt đầu quá trình xác thực Google? Một trình duyệt sẽ được mở.')) {
                await fetch(`${API_BASE}/auth/setup`, { method: 'POST' });
                alert('Vui lòng hoàn tất đăng nhập trong cửa sổ trình duyệt vừa mở.');
            }
        }

        function openCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

        async function submitCreateNotebook() {
            const name = document.getElementById('new-nb-name').value;
            const description = document.getElementById('new-nb-desc').value;
            if (!name) return alert('Vui lòng nhập tên Notebook');
            
            await fetch(`${API_BASE}/notebooks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });
            
            closeCreateModal();
            fetchNotebooks();
        }

        async function syncToCloud() {
            const btn = document.getElementById('sync-cloud-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin text-blue-400"></i> Đang đồng bộ...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                const res = await fetch(`${API_BASE}/sync-supabase`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert(`✅ Thành công! Đã đồng bộ ${data.count} Notebooks lên Supabase.`);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                alert(`❌ Lỗi đồng bộ: ${err.message}`);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // Khởi chạy
        checkHealth();
        fetchNotebooks();
        
        // Tự động làm mới mỗi 30s
        setInterval(fetchNotebooks, 30000);
    </script>
</body>
</html>
